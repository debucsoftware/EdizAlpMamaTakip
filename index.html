<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffb6c1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Bebek beslenme ve kaka takip uygulaması">
  <title>Bebiş Takip 👶</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="clouds" aria-hidden="true">
    <span class="cloud c1">☁️</span>
    <span class="cloud c2">☁️</span>
    <span class="cloud c3">☁️</span>
  </div>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon bounce">👶</span>
        <div>
          <h1 id="babyName">Bebiş Takip</h1>
          <p class="subtitle" id="todayDate"></p>
        </div>
      </div>
      <button class="btn-icon" id="settingsBtn" aria-label="Ayarlar">⚙️</button>
    </div>
  </header>

  <main class="main">
    <!-- Günlük Özet -->
    <section class="stats-card card">
      <h2 class="section-title">📊 Bugünün Özeti</h2>
      <div class="stats-grid">
        <div class="stat-item stat-milk">
          <span class="stat-emoji">🍼</span>
          <span class="stat-value" id="statSut">0</span>
          <span class="stat-label">ml Süt</span>
        </div>
        <div class="stat-item stat-formula">
          <span class="stat-emoji">🍶</span>
          <span class="stat-value" id="statMama">0</span>
          <span class="stat-label">ml Mama</span>
        </div>
        <div class="stat-item stat-total">
          <span class="stat-emoji">💧</span>
          <span class="stat-value" id="statTotal">0</span>
          <span class="stat-label">ml Toplam</span>
        </div>
        <div class="stat-item stat-poop">
          <span class="stat-emoji">💩</span>
          <span class="stat-value" id="statKaka">0</span>
          <span class="stat-label">Bez</span>
        </div>
      </div>
      <p class="encouragement" id="encouragement"></p>
    </section>

    <!-- Hızlı Ekleme -->
    <section class="quick-add card">
      <h2 class="section-title">✨ Hızlı Ekle</h2>
      <div class="type-tabs">
        <button class="type-tab active" data-type="sut">🍼 Süt</button>
        <button class="type-tab" data-type="mama">🍶 Mama</button>
        <button class="type-tab" data-type="kaka">💩 Kaka</button>
      </div>

      <div class="amount-section" id="amountSection">
        <label class="field-label">Miktar (ml)</label>
        <div class="amount-presets">
          <button class="preset-btn" data-ml="30">30</button>
          <button class="preset-btn" data-ml="60">60</button>
          <button class="preset-btn" data-ml="90">90</button>
          <button class="preset-btn" data-ml="120">120</button>
          <button class="preset-btn" data-ml="150">150</button>
          <button class="preset-btn" data-ml="180">180</button>
        </div>
        <input type="number" id="amountInput" class="input" placeholder="veya miktar gir..." min="1" max="500" inputmode="numeric">
      </div>

      <div class="time-section">
        <label class="field-label">Saat</label>
        <input type="time" id="timeInput" class="input">
      </div>

      <button class="btn-primary" id="addBtn">
        <span class="btn-emoji">➕</span> Kaydet
      </button>
    </section>

    <!-- Bugünkü Kayıtlar -->
    <section class="timeline card">
      <div class="timeline-header">
        <h2 class="section-title">📋 Bugünkü Kayıtlar</h2>
        <button class="btn-text" id="reportBtn">📄 Rapor Al</button>
      </div>
      <ul class="timeline-list" id="timelineList">
        <li class="empty-state">Henüz kayıt yok. İlk kaydı ekleyin! 🌟</li>
      </ul>
    </section>

    <!-- Geçmiş Günler -->
    <section class="history card">
      <h2 class="section-title">📅 Geçmiş Günler</h2>
      <div class="history-list" id="historyList">
        <p class="empty-state">Henüz geçmiş kayıt yok.</p>
      </div>
    </section>
  </main>

  <!-- Ayarlar Modal -->
  <div class="modal-overlay" id="settingsModal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3>⚙️ Ayarlar</h3>
        <button class="btn-close" id="closeSettings">&times;</button>
      </div>
      <div class="modal-body">
        <label class="field-label">Bebeğin Adı</label>
        <input type="text" id="babyNameInput" class="input" placeholder="Örn: Minik Prenses" maxlength="30">
        <p class="hint">Verileriniz telefonunuzda saklanır, sunucuya gönderilmez.</p>
      </div>
      <div class="modal-footer">
        <button class="btn-primary" id="saveSettings">Kaydet</button>
      </div>
    </div>
  </div>

  <!-- Rapor Modal -->
  <div class="modal-overlay" id="reportModal" hidden>
    <div class="modal modal-report">
      <div class="modal-header">
        <h3>📄 Günlük Rapor</h3>
        <button class="btn-close" id="closeReport">&times;</button>
      </div>
      <div class="modal-body">
        <pre class="report-content" id="reportContent"></pre>
      </div>
      <div class="modal-footer modal-footer-split">
        <button class="btn-secondary" id="copyReport">📋 Kopyala</button>
        <button class="btn-primary" id="shareReport">📤 Paylaş</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <script src="js/seed-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
